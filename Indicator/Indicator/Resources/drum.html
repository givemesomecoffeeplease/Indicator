<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indicator · Drum</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f2ee">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f2ee;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',sans-serif;
       height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
  /* 상단 헤더(제목·상태)를 완전히 없앴다(2026-09-03) — 공연 중엔 그 자리도 악보로 쓰는 게 낫다.
     오선·음표는 진한 잉크색(INK)이라 밝은 "종이" 배경이 필요하다 — chart.html의 악보 카드와 같은 원리.
     줄마다 구분 박스를 두지 않고 전체를 하나의 연속된 흰 페이지로 — chart.html 편집 화면과 같은 느낌. */
  #scoreWrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 60px;background:#f4f2ee}
  .line{position:relative;margin-top:6px}
  /* 캡션(섹션명·가사)을 마디 위가 아니라 아래에 둔다(2026-09-02) — 그 줄을 연주하는 동안
     가사가 바로 아래 보이는 배치. 정확한 x위치(그 섹션이 실제 시작하는 마디)는 margin-left를
     퍼센트로 줘서 맞춘다 — position:absolute+top으로 하면 svg 렌더 높이가 뷰포트 폭에 따라
     반응형으로 바뀌어서 정확한 세로 위치를 CSS만으로 알 수 없다(JS로 매번 재는 것보다
     일반 문서 흐름에 맡기는 게 더 견고함).
     가사가 한 줄로 잘려 보이던 문제 수정 — 슬라이드 전체(줄바꿈 포함)를 그대로 보여준다.
     세로로 쌓이는 만큼 폭도 넉넉히 줘서(60%) 짧은 마디 폭 안에 갇혀 줄바꿈이 과하게
     일어나지 않도록 함. */
  .line .cap{margin-top:4px;display:flex;flex-direction:column;gap:2px;max-width:60%}
  .line .cap .sec{font-size:16px;font-weight:700;color:#2a7a5c;white-space:nowrap}
  .line .cap .lyr{font-size:15px;color:#8a8578;white-space:pre-line;line-height:1.35}
  .line svg{display:block;width:100%;height:auto;margin-top:6px}
  /* 곡 경계 표시 — 곡이 바뀌어도 화면이 전환/리셋되지 않고 계속 이어서 스크롤되므로(2026-09-03),
     "다음 곡" 같은 미리보기 뉘앙스 없이 그냥 곡 제목만 담백하게 표시한다. */
  .songDivider{margin:30px 0 10px;padding-top:18px;border-top:2px dashed #d8d4c8;
    font-size:15px;font-weight:800;color:#3a3730;letter-spacing:.02em}
  #noLink{flex:1;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px;padding:24px;text-align:center;background:#14141a}
</style>
</head>
<body>

<div id="scoreWrap"><div id="lines"></div></div>
<div id="noLink" style="display:none"></div>

<script src="/notation.js"></script>
<script>
const { paint, buildLineGroups, beatCount, normTs, tsKey, SVG_NS, LG, el } = Notation;
const linesEl = document.getElementById('lines');
const noLinkEl = document.getElementById('noLink');
const scoreWrapEl = document.getElementById('scoreWrap');

function showEmpty(msg){
  scoreWrapEl.style.display = 'none';
  noLinkEl.style.display = 'flex';
  noLinkEl.textContent = msg;
}
function showScore(){
  scoreWrapEl.style.display = '';
  noLinkEl.style.display = 'none';
}

// 곡 하나의 채보(/api/drumChart) + 섹션 목록(/api/sections)을 받아와 렌더링 가능한 형태로
// 가공한다. 섹션 시작을 강제 줄바꿈으로는 더 이상 쓰지 않는다 — 2마디짜리 간주 같은 짧은
// 섹션이 그 이유만으로 혼자 줄 하나를 차지하면 어색해서, /chart 편집 화면과 완전히 같은
// 줄바꿈 결과(순수 4마디 균등 분배 + 앞줄로/뒷줄로 수동 지정)를 쓴다. 캡션은 그 섹션이
// 시작하는 마디가 속한 줄에(줄의 첫 마디가 아니어도) 그대로 붙인다.
function fetchChartData(songName){
  if(!songName) return Promise.resolve(null);
  return Promise.all([
    fetch('/api/drumChart?song=' + encodeURIComponent(songName)).then(r=>r.json()).catch(()=>({})),
    fetch('/api/sections').then(r=>r.json()).catch(()=>[]),
  ]).then(([chart, allSections])=>{
    if(!chart || !Array.isArray(chart.measures) || !chart.measures.length) return null;
    const measures = chart.measures;
    const startBarPos = (typeof chart.startBarPosition === 'number') ? chart.startBarPosition : null;

    const sectionLineMeta = {};
    if(startBarPos !== null){
      (Array.isArray(allSections) ? allSections : [])
        .filter(s=>s.song === songName && typeof s.barPosition === 'number')
        .forEach(o=>{
          // floor: barPosition은 마디 N의 시작=N부터 다음 마디 직전=N+0.999...까지 연속으로 늘어나는
          // 값이라 round를 쓰면 마디 중간(N+0.5)에서 벌써 다음 마디로 넘어가 타이밍이 반 마디 어긋난다.
          // +0.02: 마커가 마디 경계(예: 8.0)에 있어도 실측 결과 barPosition이 7.997~7.999처럼
          // 최대 0.003 정도 못 미치게 나옴(로직 마커 타임코드가 프레임 단위로 양자화되며 생기는
          // 실제 오차 — 1e-6 수준의 순수 부동소수점 오차가 아니었음, 이전 수정이 못 잡은 원인).
          // floor가 한 마디 전으로 잘못 내림해 섹션명·가사가 항상 한 마디씩 일찍 표시되던 버그.
          const mi = Math.floor(o.barPosition - startBarPos + 0.02);
          if(mi >= 0 && mi < measures.length){
            sectionLineMeta[mi] = {sectionLabel: o.section, lyricCue: o.lyricCue || ''};
          }
        });
    }
    const lineGroups = buildLineGroups(measures, [], 4);   // 섹션 경계는 하드 브레이크로 안 씀 — /chart와 동일 결과
    lineGroups.forEach(g=>{
      let meta = null, metaMi = -1;
      for(let mi = g.measureStartIdx; mi < g.measureStartIdx + g.measureCount; mi++){
        if(sectionLineMeta[mi]){ meta = sectionLineMeta[mi]; metaMi = mi; break; }
      }
      g.meta = meta;
      g.metaMi = metaMi;   // 캡션을 줄 맨 앞이 아니라 실제 그 마디 위치에 붙이기 위한 인덱스
    });
    return {measures, startBarPos, lineGroups};
  });
}

/* ===== 연속 스크롤 모델(2026-09-03) =====
   예전엔 곡이 바뀔 때마다 화면 전체를 다시 그려서(=innerHTML 통째로 교체) "전환"되는
   느낌이 있었다. 이제는 재생 중인 곡 + 다음 곡을 DOM에 순서대로 계속 쌓아두고, 실제로
   곡이 넘어가는 순간엔 다시 그리지 않고 "지금 재생 중"이라는 표식(가리키는 인덱스)만
   옮긴다 — 화면은 그냥 계속 스크롤되는 하나의 긴 흐름처럼 보인다.
   renderedSongs[0] = 지금 재생 중인 곡, renderedSongs[1] = 다음 곡(미리 그려둠). */
let renderedSongs = [];   // [{songName, measures, startBarPos, lineGroups, posCache, blockId}]
let songSeq = 0;          // 곡마다 고유한 DOM id 접두어를 만들기 위한 카운터
let loadingCurrent = null, loadingNext = null;
let songDataReady = false;

function paintCaption(svgEl, g, capEl, cache){
  if(!g.meta) return;
  const pos = cache[g.metaMi];
  const svgW = svgEl.viewBox.baseVal.width || 1;
  const leftPct = pos ? (pos.x0 / svgW * 100) : 0;
  capEl.style.marginLeft = leftPct + '%';
  capEl.innerHTML = `<span class="sec">${esc(g.meta.sectionLabel)}</span>${g.meta.lyricCue ? `<span class="lyr">${esc(g.meta.lyricCue)}</span>` : ''}`;
}
function esc(s){ return String(s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// 곡 하나를 DOM 맨 끝에 이어붙인다(기존 내용은 안 건드림) — isFirst=true면 구분선 없이,
// 아니면 곡 제목 구분선을 먼저 붙인다.
function appendSongBlock(songName, data, isFirst){
  const blockId = 'song' + (songSeq++);
  const dividerHtml = isFirst ? '' : `<div class="songDivider">${esc(songName)}</div>`;
  const linesHtml = data.lineGroups.map((g, gi)=>
    `<div class="line" id="${blockId}_l${gi}"><svg xmlns="${SVG_NS}"></svg><div class="cap"></div></div>`
  ).join('');
  linesEl.insertAdjacentHTML('beforeend', dividerHtml + linesHtml);
  const posCache = {};
  data.lineGroups.forEach((g, gi)=>{
    const lineDiv = document.getElementById(`${blockId}_l${gi}`);
    const svgEl = lineDiv.querySelector('svg');
    const capEl = lineDiv.querySelector('.cap');
    paint(svgEl, {measures: data.measures, from:g.measureStartIdx, to:g.measureStartIdx+g.measureCount, refCount:4, cache:posCache});
    paintCaption(svgEl, g, capEl, posCache);
  });
  return {songName, measures: data.measures, startBarPos: data.startBarPos, lineGroups: data.lineGroups, posCache, blockId};
}
function removeSongBlock(entry){
  if(!entry) return;
  entry.lineGroups.forEach((g, gi)=>{
    const lineDiv = document.getElementById(`${entry.blockId}_l${gi}`);
    if(lineDiv) lineDiv.remove();
  });
  // 그 블록 바로 앞에 있던 곡 구분선도 같이 지운다(마지막에 붙인 블록을 취소할 때만 씀).
  const dividers = linesEl.querySelectorAll('.songDivider');
  const last = dividers[dividers.length-1];
  if(last) last.remove();
}

function startFreshWith(songName){
  loadingCurrent = songName;
  songDataReady = false;
  linesEl.innerHTML = '';
  renderedSongs = [];
  if(!songName){ showEmpty('곡 재생을 기다리는 중…'); return; }
  fetchChartData(songName).then(data=>{
    if(loadingCurrent !== songName) return;   // 그 사이 다른 곡으로 또 넘어갔으면 버림
    if(!data){
      showEmpty(`"${songName}" 곡에 업로드된 드럼 채보가 없습니다.\n/edit에서 그 곡에 .drum.json을 업로드해 주세요.`);
      return;
    }
    showScore();
    renderedSongs = [appendSongBlock(songName, data, true)];
    songDataReady = true;
    curMeasureHl = -1;
  });
}

let curMeasureHl = -1;
let curHlSvg = null;

// chart.html의 #logicHighlight와 동일한 방식 — 마디 하나 전체를 옅게 깔아주는 사각형 하나만 이동.
function setHighlight(mi){
  const cur = renderedSongs[0];
  if(!cur) return;
  const pos = cur.posCache[mi];
  if(!pos) return;
  const gi = cur.lineGroups.findIndex(g => mi >= g.measureStartIdx && mi < g.measureStartIdx + g.measureCount);
  if(gi === -1) return;
  const lineDiv = document.getElementById(`${cur.blockId}_l${gi}`);
  const svgEl = lineDiv && lineDiv.querySelector('svg');
  if(!svgEl) return;
  if(curHlSvg && curHlSvg !== svgEl){
    const old = curHlSvg.querySelector('#hl');
    if(old) old.remove();
  }
  curHlSvg = svgEl;
  let r = svgEl.querySelector('#hl');
  if(!r){
    r = el('rect', {id:'hl', fill:'#2a9d6f', opacity:'0.16', rx:'7', 'pointer-events':'none'});
    svgEl.insertBefore(r, svgEl.firstChild);
  }
  r.setAttribute('x', pos.x0);
  r.setAttribute('y', pos.top - 26);
  r.setAttribute('width', pos.w);
  r.setAttribute('height', 4*LG + 52);
  lineDiv.scrollIntoView({block:'center', behavior:'smooth'});
}

function applyState(st){
  const songs = Array.isArray(st.songs) ? st.songs : [];
  const songName = st.currentSongIndex >= 0 ? songs[st.currentSongIndex] : null;
  const upcomingName = st.currentSongIndex >= 0 ? songs[st.currentSongIndex + 1] : null;

  if(!songName){
    if(renderedSongs.length === 0) showEmpty('곡 재생을 기다리는 중…');
    return;
  }

  const cur = renderedSongs[0];
  if(!cur || cur.songName !== songName){
    const next = renderedSongs[1];
    if(next && next.songName === songName){
      // 이미 다음 곡으로 미리 그려둔 게 바로 지금 넘어간 곡이면, 다시 그리지 않고 그냥
      // "지금 재생 중"이 가리키는 자리만 옮긴다 — 화면은 계속 이어서 스크롤될 뿐 아무
      // 것도 다시 그려지지 않는다(전환처럼 안 보이는 이유).
      renderedSongs.shift();
      songDataReady = true;
      curMeasureHl = -1;
    } else {
      // 완전히 다른 곡으로 건너뜀(또는 첫 로드) — 이번만 처음부터 다시 그린다.
      if(loadingCurrent !== songName) startFreshWith(songName);
      return;   // 이 틱은 로딩을 기다림
    }
  }

  // 다음 곡 준비: 이미 맞는 곡이 붙어 있으면 그대로 두고, 아니면 새로 불러와 뒤에 이어붙인다.
  const haveNext = renderedSongs[1] && renderedSongs[1].songName === upcomingName;
  if(!haveNext){
    if(renderedSongs[1] && renderedSongs[1].songName !== upcomingName){
      // 다음 곡이 바뀌었다(세트리스트 재편 등) — 미리 그려둔 옛 다음 곡은 지운다.
      removeSongBlock(renderedSongs.pop());
      loadingNext = null;
    }
    if(upcomingName && loadingNext !== upcomingName){
      loadingNext = upcomingName;
      fetchChartData(upcomingName).then(data=>{
        if(loadingNext !== upcomingName) return;
        if(data) renderedSongs.push(appendSongBlock(upcomingName, data, false));
      });
    }
  }

  if(!songDataReady) return;   // 로딩 중(또는 채보 없음)이면 이 틱은 하이라이트 계산을 건너뜀
  const nowCur = renderedSongs[0];
  if(nowCur.startBarPos === null) return;
  if(!st.isPlaying || typeof st.barPosition !== 'number') return;
  const curMeasureIdx = Math.floor(st.barPosition - nowCur.startBarPos + 1e-6);   // 캡션과 동일한 부동소수점 보정
  if(curMeasureIdx === curMeasureHl) return;
  curMeasureHl = curMeasureIdx;
  setHighlight(curMeasureIdx);
}

showEmpty('곡 재생을 기다리는 중…');
// index.html/singer.html과 동일한 재연결 패턴 — 브라우저 기본 EventSource 자동 재연결만
// 믿었더니, 화면을 오래 켜둬서(백그라운드 탭·절전 등) 연결이 조용히 끊긴 뒤 다시 안 살아나
// 악보가 멈춘 채로 안 보이는 문제가 있었음(2026-08-30). 직접 닫고 지수 백오프로 재연결한다.
(function connectSSE(){
  let es, reconnectDelay = 1000;
  function connect(){
    try{ es = new EventSource('/events'); }catch(e){ return; }
    es.onopen = ()=>{ reconnectDelay = 1000; };
    es.onmessage = e=>{
      let st; try{ st = JSON.parse(e.data); }catch(err){ return; }
      applyState(st);
    };
    es.onerror = ()=>{
      es.close();
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    };
  }
  connect();
})();
</script>
</body>
</html>
