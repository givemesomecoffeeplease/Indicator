<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indicator · Drum</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14141a">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#14141a;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',sans-serif;
       height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
  #top{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
       padding:8px 16px;border-bottom:1px solid #24242e}
  #top .title{font-size:14px;font-weight:700;color:#f0f0f0}
  #top .sub{font-size:11px;color:#666;margin-top:2px}
  #top .status{font-size:11px;color:#5dcaa5;font-variant-numeric:tabular-nums}
  #top .status.off{color:#555}
  /* 오선·음표는 진한 잉크색(INK)이라 밝은 "종이" 배경이 필요하다 — chart.html의 악보 카드와 같은 원리.
     줄마다 구분 박스를 두지 않고 전체를 하나의 연속된 흰 페이지로 — chart.html 편집 화면과 같은 느낌. */
  #scoreWrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 60px;background:#f4f2ee}
  .line{position:relative;margin-top:6px}
  .line .cap{position:absolute;top:0;display:flex;align-items:baseline;gap:10px;min-height:20px;
             white-space:nowrap;transform:translateX(-2px)}
  .line .cap .sec{font-size:16px;font-weight:700;color:#2a7a5c}
  .line .cap .lyr{font-size:15px;color:#8a8578;overflow:hidden;text-overflow:ellipsis}
  .line svg{display:block;width:100%;height:auto;margin-top:22px}
  #noLink{flex:1;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px;padding:24px;text-align:center;background:#14141a}
</style>
</head>
<body>

<div id="top">
  <div>
    <div class="title" id="chartTitle">드럼 뷰어</div>
    <div class="sub" id="chartSub">곡 재생을 기다리는 중…</div>
  </div>
  <div class="status off" id="syncStatus">대기 중</div>
</div>
<div id="scoreWrap"><div id="lines"></div></div>
<div id="noLink" style="display:none"></div>

<script src="/notation.js"></script>
<script>
const { paint, buildLineGroups, beatCount, normTs, tsKey, SVG_NS, LG, el } = Notation;
const linesEl = document.getElementById('lines');
const noLinkEl = document.getElementById('noLink');
const scoreWrapEl = document.getElementById('scoreWrap');

// 선언 누락 버그 수정(2026-08-17): 아래 변수들이 선언 없이 쓰이고 있어서, 첫 SSE 메시지가
// 도착해 applyState()가 curSongName을 읽으려는 순간(아직 loadSong이 한 번도 실행 안 돼
// 할당된 적 없는 시점) ReferenceError가 나 매번 화면 갱신이 통째로 멈췄었다.
let curSongName = null;
let loadingSong = null;
let measures = [];
let startBarPos = null;
let lineGroups = [];
let sectionLineMeta = {};

function showEmpty(msg){
  scoreWrapEl.style.display = 'none';
  noLinkEl.style.display = 'flex';
  noLinkEl.textContent = msg;
}
function showScore(){
  scoreWrapEl.style.display = '';
  noLinkEl.style.display = 'none';
}

// 곡이 바뀔 때마다: 그 곡의 채보(/api/drumChart) + 섹션 목록(/api/sections)을 같이 받아와
// 캡션(섹션명·가사)을 계산하고 다시 그린다. 섹션 시작을 강제 줄바꿈으로는 더 이상 쓰지 않는다 —
// 2마디짜리 간주 같은 짧은 섹션이 그 이유만으로 혼자 줄 하나를 차지하면 어색해서, /chart 편집
// 화면과 완전히 같은 줄바꿈 결과(순수 4마디 균등 분배 + 앞줄로/뒷줄로 수동 지정)를 쓴다.
// 캡션은 그 섹션이 시작하는 마디가 속한 줄에(줄의 첫 마디가 아니어도) 그대로 붙인다.
function loadSong(songName){
  if(loadingSong === songName) return;
  loadingSong = songName;
  curSongName = songName;
  startBarPos = null;
  lineGroups = [];
  document.getElementById('chartTitle').textContent = songName || '드럼 뷰어';
  document.getElementById('chartSub').textContent = '채보 불러오는 중…';
  if(!songName){ showEmpty('곡 재생을 기다리는 중…'); return; }

  Promise.all([
    fetch('/api/drumChart?song=' + encodeURIComponent(songName)).then(r=>r.json()).catch(()=>({})),
    fetch('/api/sections').then(r=>r.json()).catch(()=>[]),
  ]).then(([chart, allSections])=>{
    if(loadingSong !== songName) return;   // 그 사이 다른 곡으로 또 넘어갔으면 버림
    if(!chart || !Array.isArray(chart.measures) || !chart.measures.length){
      showEmpty(`"${songName}" 곡에 업로드된 드럼 채보가 없습니다.\n/edit에서 그 곡에 .mai.json을 업로드해 주세요.`);
      return;
    }
    measures = chart.measures;   // paint()/drawMeasure류가 참조하는 전역
    startBarPos = (typeof chart.startBarPosition === 'number') ? chart.startBarPosition : null;

    sectionLineMeta = {};
    if(startBarPos !== null){
      (Array.isArray(allSections) ? allSections : [])
        .filter(s=>s.song === songName && typeof s.barPosition === 'number')
        .forEach(o=>{
          // floor: barPosition은 마디 N의 시작=N부터 다음 마디 직전=N+0.999...까지 연속으로 늘어나는
          // 값이라 round를 쓰면 마디 중간(N+0.5)에서 벌써 다음 마디로 넘어가 타이밍이 반 마디 어긋난다.
          // +1e-6: 마커가 정확히 마디 경계(예: 8.0)에 있어도 템포맵 보간 부동소수점 오차로
          // 7.999999...처럼 살짝 못 미치게 나올 수 있어, floor가 한 마디 전으로 잘못 내림하는
          // 문제 보정 — 섹션명·가사가 항상 정확히 한 마디씩 일찍 표시되던 버그의 원인이었다.
          const mi = Math.floor(o.barPosition - startBarPos + 1e-6);
          if(mi >= 0 && mi < measures.length){
            sectionLineMeta[mi] = {sectionLabel: o.section, lyricCue: o.lyricCue || ''};
          }
        });
    }
    lineGroups = buildLineGroups(measures, [], 4);   // 섹션 경계는 하드 브레이크로 안 씀 — /chart와 동일 결과
    lineGroups.forEach(g=>{
      let meta = null, metaMi = -1;
      for(let mi = g.measureStartIdx; mi < g.measureStartIdx + g.measureCount; mi++){
        if(sectionLineMeta[mi]){ meta = sectionLineMeta[mi]; metaMi = mi; break; }
      }
      g.meta = meta;
      g.metaMi = metaMi;   // 캡션을 줄 맨 앞이 아니라 실제 그 마디 위치에 붙이기 위한 인덱스
    });

    document.getElementById('chartSub').textContent = `${measures.length}마디${startBarPos===null ? ' · 타이밍 정보 없음(마커 확인 필요)' : ''}`;
    showScore();
    renderLines();
    curMeasureHl = -1;
  });
}

let posCache = {};   // 전역 마디 인덱스 -> {x0, top, w} (해당 줄의 own svg 좌표계)
function renderLines(){
  // 캡션(.cap)을 줄 맨 앞 고정이 아니라, 그 섹션/가사가 실제로 시작하는 마디 바로 위에
  // 절대좌표로 붙인다 — 줄 중간에서 시작하는 섹션이 줄 맨 앞에 표시돼 몇 마디씩 일찍
  // 보이던 문제 수정. paint()가 posCache를 채운 뒤에야 정확한 x 위치를 알 수 있으므로
  // 악보를 먼저 그리고 나서 캡션을 얹는 순서로 바꾼다.
  linesEl.innerHTML = lineGroups.map((g, gi)=>
    `<div class="line" id="line${gi}"><div class="cap" id="cap${gi}"></div><svg xmlns="${SVG_NS}"></svg></div>`
  ).join('');
  posCache = {};
  lineGroups.forEach((g, gi)=>{
    const svgEl = document.querySelector(`#line${gi} svg`);
    if(!svgEl) return;
    paint(svgEl, {measures, from:g.measureStartIdx, to:g.measureStartIdx+g.measureCount, refCount:4, cache:posCache});
    if(g.meta){
      const pos = posCache[g.metaMi];
      const svgW = svgEl.viewBox.baseVal.width || 1;
      const leftPct = pos ? (pos.x0 / svgW * 100) : 0;
      const capEl = document.getElementById('cap' + gi);
      capEl.style.left = leftPct + '%';
      capEl.innerHTML = `<span class="sec">${esc(g.meta.sectionLabel)}</span>${g.meta.lyricCue ? `<span class="lyr">${esc(g.meta.lyricCue)}</span>` : ''}`;
    }
  });
}
function esc(s){ return String(s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ===== 라이브 동기화 — 서버가 매 틱 계산해 주는 barPosition(실제 로직 템포맵 기준)만 쓴다.
   채보에 입력하는 bpm은 편집 화면 참고용일 뿐 여기선 전혀 안 쓴다. ===== */
let curMeasureHl = -1;
let curHlSvg = null;
const statusEl = document.getElementById('syncStatus');

// chart.html의 #logicHighlight와 동일한 방식 — 마디 하나 전체를 옅게 깔아주는 사각형 하나만 이동.
function setHighlight(mi){
  const pos = posCache[mi];
  if(!pos) return;
  const gi = lineGroups.findIndex(g => mi >= g.measureStartIdx && mi < g.measureStartIdx + g.measureCount);
  if(gi === -1) return;
  const svgEl = document.querySelector(`#line${gi} svg`);
  if(!svgEl) return;
  if(curHlSvg && curHlSvg !== svgEl){
    const old = curHlSvg.querySelector('#hl');
    if(old) old.remove();
  }
  curHlSvg = svgEl;
  let r = svgEl.querySelector('#hl');
  if(!r){
    r = el('rect', {id:'hl', fill:'#2a9d6f', opacity:'0.16', rx:'7', 'pointer-events':'none'});
    svgEl.insertBefore(r, svgEl.firstChild);
  }
  r.setAttribute('x', pos.x0);
  r.setAttribute('y', pos.top - 26);
  r.setAttribute('width', pos.w);
  r.setAttribute('height', 4*LG + 52);
  document.getElementById('line' + gi).scrollIntoView({block:'center', behavior:'smooth'});
}
function clearHighlight(){
  if(curHlSvg){
    const old = curHlSvg.querySelector('#hl');
    if(old) old.remove();
  }
  curHlSvg = null;
  curMeasureHl = -1;
}

function applyState(st){
  // 지금 재생 중인 곡이 바뀌었으면(세트리스트 다음 곡으로 넘어감 등) 채보를 자동으로 갈아끼운다.
  const songName = (Array.isArray(st.songs) && st.currentSongIndex >= 0) ? st.songs[st.currentSongIndex] : null;
  if(songName !== curSongName){
    loadSong(songName);
    return;   // 이 틱은 새 채보 로딩을 기다림 — 다음 틱부터 하이라이트 반영
  }
  if(startBarPos === null){
    statusEl.textContent = songName ? '타이밍 정보 없음' : '대기 중';
    statusEl.classList.add('off');
    return;
  }
  if(!st.isPlaying || typeof st.barPosition !== 'number'){
    statusEl.textContent = '정지'; statusEl.classList.add('off');
    return;
  }
  statusEl.textContent = '재생 중'; statusEl.classList.remove('off');
  const curMeasureIdx = Math.floor(st.barPosition - startBarPos + 1e-6);   // 캡션과 동일한 부동소수점 보정
  if(curMeasureIdx === curMeasureHl) return;
  curMeasureHl = curMeasureIdx;
  setHighlight(curMeasureIdx);
}

showEmpty('곡 재생을 기다리는 중…');
(function connectSSE(){
  let es;
  try{ es = new EventSource('/events'); }catch(e){ return; }
  es.onmessage = e=>{
    let st; try{ st = JSON.parse(e.data); }catch(err){ return; }
    applyState(st);
  };
  es.onerror = ()=>{ statusEl.textContent = '연결 끊김'; statusEl.classList.add('off'); };
})();
</script>
</body>
</html>
