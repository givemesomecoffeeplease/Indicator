<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indicator · Drum</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f2ee">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f2ee;color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',sans-serif;
       height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
  /* 상단 헤더(제목·상태)를 완전히 없앴다(2026-09-03) — 공연 중엔 그 자리도 악보로 쓰는 게 낫다.
     오선·음표는 진한 잉크색(INK)이라 밝은 "종이" 배경이 필요하다 — chart.html의 악보 카드와 같은 원리.
     줄마다 구분 박스를 두지 않고 전체를 하나의 연속된 흰 페이지로 — chart.html 편집 화면과 같은 느낌. */
  #scoreWrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 60px;background:#f4f2ee}
  .line{position:relative;margin-top:6px}
  /* 캡션(섹션명·가사)을 마디 위가 아니라 아래에 둔다(2026-09-02) — 그 줄을 연주하는 동안
     가사가 바로 아래 보이는 배치. 정확한 x위치(그 섹션이 실제 시작하는 마디)는 margin-left를
     퍼센트로 줘서 맞춘다 — position:absolute+top으로 하면 svg 렌더 높이가 뷰포트 폭에 따라
     반응형으로 바뀌어서 정확한 세로 위치를 CSS만으로 알 수 없다(JS로 매번 재는 것보다
     일반 문서 흐름에 맡기는 게 더 견고함).
     가사가 한 줄로 잘려 보이던 문제 수정 — 슬라이드 전체(줄바꿈 포함)를 그대로 보여준다.
     세로로 쌓이는 만큼 폭도 넉넉히 줘서(60%) 짧은 마디 폭 안에 갇혀 줄바꿈이 과하게
     일어나지 않도록 함. */
  /* 2026-09-06: 섹션명·가사 캡션을 악보 아래→위로 이동(요청) — margin을 cap 쪽 아래로,
     svg 쪽 위로 서로 바꿔 자리만 옮기고 간격은 그대로 유지 */
  .line .cap{margin-bottom:4px;display:flex;flex-direction:column;gap:2px;max-width:60%}
  .line .cap .sec{font-size:16px;font-weight:700;color:#2a7a5c;white-space:nowrap}
  .line .cap .lyr{font-size:15px;color:#8a8578;white-space:pre-line;line-height:1.35}
  .line svg{display:block;width:100%;height:auto;margin-top:6px}
  /* 곡 경계 표시 — 곡이 바뀌어도 화면이 전환/리셋되지 않고 계속 이어서 스크롤되므로(2026-09-03),
     "다음 곡" 같은 미리보기 뉘앙스 없이 그냥 곡 제목만 담백하게 표시한다. */
  .songDivider{margin:30px 0 10px;padding-top:18px;border-top:2px dashed #d8d4c8;
    font-size:15px;font-weight:800;color:#3a3730;letter-spacing:.02em}
  #noLink{flex:1;display:flex;align-items:center;justify-content:center;color:#666;font-size:13px;padding:24px;text-align:center;background:#14141a}
  /* 드럼 영상 보기 — 곡에 영상이 연결돼 있으면 악보 대신 영상을 보여준다(2026-11-22).
     영상 위엔 컨트롤 막대를 안 둔다(공연 중 화면을 가리지 않게) — 구석의 옅은 버튼 둘뿐. */
  #videoWrap{flex:1;display:none;position:relative;background:#000;min-height:0}
  #vid{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .vbtn{position:absolute;z-index:5;border:none;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;
    font-size:13px;padding:7px 11px;opacity:.28;cursor:pointer}
  .vbtn:hover,.vbtn:active{opacity:.9}
  #viewToggle{top:10px;right:10px}
  #offsetBtn{bottom:10px;right:10px}
  #offsetPanel{position:absolute;z-index:6;left:12px;right:12px;bottom:52px;max-width:560px;margin-left:auto;
    background:rgba(20,20,26,.94);color:#eee;border-radius:12px;padding:12px 14px;display:none;font-size:13px}
  #offsetPanel .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
  #offsetPanel button{border:none;border-radius:7px;background:#2c2c38;color:#eee;padding:6px 10px;font-size:13px;cursor:pointer}
  #offsetPanel button.main{background:#5dcaa5;color:#14141a;font-weight:700}
  #offsetPanel input[type=range]{flex:1;min-width:140px}
  #offsetMsg{color:#f0b26a;margin-top:6px;min-height:16px}
</style>
</head>
<body>

<div id="scoreWrap"><div id="lines"></div></div>
<div id="noLink" style="display:none"></div>
<div id="videoWrap">
  <video id="vid" muted playsinline preload="auto"></video>
  <button id="viewToggle" class="vbtn">악보</button>
  <button id="offsetBtn" class="vbtn">⚙</button>
  <div id="offsetPanel">
    <div>시작점 <b id="offsetVal">0.00</b>초 <span style="color:#999">(영상의 이 시각이 곡 1박)</span></div>
    <div class="row">
      <button data-n="-1">−1초</button><button data-n="-0.1">−0.1</button>
      <button data-n="0.1">+0.1</button><button data-n="1">+1초</button>
      <label style="margin-left:6px"><input type="checkbox" id="followChk" checked> 로직 따라가기</label>
    </div>
    <div class="row" id="manualRow" style="display:none">
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0">
      <button data-s="-0.1">◀ 0.1</button><button data-s="0.1">0.1 ▶</button>
    </div>
    <div class="row" id="setRow" style="display:none">
      <button class="main" id="setHere">지금 영상 위치 = 로직 현재 위치</button>
    </div>
    <div id="offsetMsg"></div>
  </div>
</div>

<script src="/notation.js"></script>
<script>
const { paint, buildLineGroups, beatCount, normTs, tsKey, SVG_NS, LG, el } = Notation;
const linesEl = document.getElementById('lines');
const noLinkEl = document.getElementById('noLink');
const scoreWrapEl = document.getElementById('scoreWrap');

function showEmpty(msg){
  scoreWrapEl.style.display = 'none';
  noLinkEl.style.display = 'flex';
  noLinkEl.textContent = msg;
  applyViewMode();
}
function showScore(){
  scoreWrapEl.style.display = '';
  noLinkEl.style.display = 'none';
  applyViewMode();
}

// 곡 하나의 채보(/api/drumChart) + 섹션 목록(/api/sections)을 받아와 렌더링 가능한 형태로
// 가공한다. 섹션 시작을 강제 줄바꿈으로는 더 이상 쓰지 않는다 — 2마디짜리 간주 같은 짧은
// 섹션이 그 이유만으로 혼자 줄 하나를 차지하면 어색해서, /chart 편집 화면과 완전히 같은
// 줄바꿈 결과(순수 4마디 균등 분배 + 앞줄로/뒷줄로 수동 지정)를 쓴다. 캡션은 그 섹션이
// 시작하는 마디가 속한 줄에(줄의 첫 마디가 아니어도) 그대로 붙인다.
function fetchChartData(songName){
  if(!songName) return Promise.resolve(null);
  return Promise.all([
    fetch('/api/drumChart?song=' + encodeURIComponent(songName)).then(r=>r.json()).catch(()=>({})),
    fetch('/api/sections').then(r=>r.json()).catch(()=>[]),
  ]).then(([chart, allSections])=>{
    if(!chart || !Array.isArray(chart.measures) || !chart.measures.length) return null;
    const measures = chart.measures;
    const startBarPos = (typeof chart.startBarPosition === 'number') ? chart.startBarPosition : null;

    const sectionLineMeta = {};
    if(startBarPos !== null){
      (Array.isArray(allSections) ? allSections : [])
        .filter(s=>s.song === songName && typeof s.barPosition === 'number')
        .forEach(o=>{
          // floor: barPosition은 마디 N의 시작=N부터 다음 마디 직전=N+0.999...까지 연속으로 늘어나는
          // 값이라 round를 쓰면 마디 중간(N+0.5)에서 벌써 다음 마디로 넘어가 타이밍이 반 마디 어긋난다.
          // +0.02: 마커가 마디 경계(예: 8.0)에 있어도 실측 결과 barPosition이 7.997~7.999처럼
          // 최대 0.003 정도 못 미치게 나옴(로직 마커 타임코드가 프레임 단위로 양자화되며 생기는
          // 실제 오차 — 1e-6 수준의 순수 부동소수점 오차가 아니었음, 이전 수정이 못 잡은 원인).
          // floor가 한 마디 전으로 잘못 내림해 섹션명·가사가 항상 한 마디씩 일찍 표시되던 버그.
          const mi = Math.floor(o.barPosition - startBarPos + 0.02);
          if(mi >= 0 && mi < measures.length){
            sectionLineMeta[mi] = {sectionLabel: o.section, lyricCue: o.lyricCue || ''};
          }
        });
    }
    const lineGroups = buildLineGroups(measures, [], 4);   // 섹션 경계는 하드 브레이크로 안 씀 — /chart와 동일 결과
    lineGroups.forEach(g=>{
      let meta = null, metaMi = -1;
      for(let mi = g.measureStartIdx; mi < g.measureStartIdx + g.measureCount; mi++){
        if(sectionLineMeta[mi]){ meta = sectionLineMeta[mi]; metaMi = mi; break; }
      }
      g.meta = meta;
      g.metaMi = metaMi;   // 캡션을 줄 맨 앞이 아니라 실제 그 마디 위치에 붙이기 위한 인덱스
    });
    return {measures, startBarPos, lineGroups};
  });
}

/* ===== 연속 스크롤 모델(2026-09-03) =====
   예전엔 곡이 바뀔 때마다 화면 전체를 다시 그려서(=innerHTML 통째로 교체) "전환"되는
   느낌이 있었다. 이제는 재생 중인 곡 + 다음 곡을 DOM에 순서대로 계속 쌓아두고, 실제로
   곡이 넘어가는 순간엔 다시 그리지 않고 "지금 재생 중"이라는 표식(가리키는 인덱스)만
   옮긴다 — 화면은 그냥 계속 스크롤되는 하나의 긴 흐름처럼 보인다.
   renderedSongs[0] = 지금 재생 중인 곡, renderedSongs[1] = 다음 곡(미리 그려둠). */
let renderedSongs = [];   // [{songName, measures, startBarPos, lineGroups, posCache, blockId}]
let songSeq = 0;          // 곡마다 고유한 DOM id 접두어를 만들기 위한 카운터
let loadingCurrent = null, loadingNext = null;
let songDataReady = false;

function paintCaption(svgEl, g, capEl, cache){
  if(!g.meta) return;
  const pos = cache[g.metaMi];
  const svgW = svgEl.viewBox.baseVal.width || 1;
  const leftPct = pos ? (pos.x0 / svgW * 100) : 0;
  capEl.style.marginLeft = leftPct + '%';
  capEl.innerHTML = `<span class="sec">${esc(g.meta.sectionLabel)}</span>${g.meta.lyricCue ? `<span class="lyr">${esc(g.meta.lyricCue)}</span>` : ''}`;
}
function esc(s){ return String(s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// 곡 하나를 DOM 맨 끝에 이어붙인다(기존 내용은 안 건드림) — isFirst=true면 구분선 없이,
// 아니면 곡 제목 구분선을 먼저 붙인다.
function appendSongBlock(songName, data, isFirst){
  const blockId = 'song' + (songSeq++);
  const dividerHtml = isFirst ? '' : `<div class="songDivider">${esc(songName)}</div>`;
  const linesHtml = data.lineGroups.map((g, gi)=>
    `<div class="line" id="${blockId}_l${gi}"><div class="cap"></div><svg xmlns="${SVG_NS}"></svg></div>`
  ).join('');
  linesEl.insertAdjacentHTML('beforeend', dividerHtml + linesHtml);
  const posCache = {};
  data.lineGroups.forEach((g, gi)=>{
    const lineDiv = document.getElementById(`${blockId}_l${gi}`);
    const svgEl = lineDiv.querySelector('svg');
    const capEl = lineDiv.querySelector('.cap');
    paint(svgEl, {measures: data.measures, from:g.measureStartIdx, to:g.measureStartIdx+g.measureCount, refCount:4, cache:posCache});
    paintCaption(svgEl, g, capEl, posCache);
  });
  return {songName, measures: data.measures, startBarPos: data.startBarPos, lineGroups: data.lineGroups, posCache, blockId};
}
function removeSongBlock(entry){
  if(!entry) return;
  entry.lineGroups.forEach((g, gi)=>{
    const lineDiv = document.getElementById(`${entry.blockId}_l${gi}`);
    if(lineDiv) lineDiv.remove();
  });
  // 그 블록 바로 앞에 있던 곡 구분선도 같이 지운다(마지막에 붙인 블록을 취소할 때만 씀).
  const dividers = linesEl.querySelectorAll('.songDivider');
  const last = dividers[dividers.length-1];
  if(last) last.remove();
}

function startFreshWith(songName){
  loadingCurrent = songName;
  songDataReady = false;
  linesEl.innerHTML = '';
  renderedSongs = [];
  if(!songName){ showEmpty('곡 재생을 기다리는 중…'); return; }
  fetchChartData(songName).then(data=>{
    if(loadingCurrent !== songName) return;   // 그 사이 다른 곡으로 또 넘어갔으면 버림
    if(!data){
      showEmpty(`"${songName}" 곡에 업로드된 드럼 채보가 없습니다.\n/edit에서 그 곡에 .drum.json을 업로드해 주세요.`);
      return;
    }
    showScore();
    renderedSongs = [appendSongBlock(songName, data, true)];
    songDataReady = true;
    curMeasureHl = -1;
  });
}

let curMeasureHl = -1;
let curHlSvg = null;

// chart.html의 #logicHighlight와 동일한 방식 — 마디 하나 전체를 옅게 깔아주는 사각형 하나만 이동.
function setHighlight(mi){
  const cur = renderedSongs[0];
  if(!cur) return;
  const pos = cur.posCache[mi];
  if(!pos) return;
  const gi = cur.lineGroups.findIndex(g => mi >= g.measureStartIdx && mi < g.measureStartIdx + g.measureCount);
  if(gi === -1) return;
  const lineDiv = document.getElementById(`${cur.blockId}_l${gi}`);
  const svgEl = lineDiv && lineDiv.querySelector('svg');
  if(!svgEl) return;
  if(curHlSvg && curHlSvg !== svgEl){
    const old = curHlSvg.querySelector('#hl');
    if(old) old.remove();
  }
  curHlSvg = svgEl;
  let r = svgEl.querySelector('#hl');
  if(!r){
    r = el('rect', {id:'hl', fill:'#2a9d6f', opacity:'0.16', rx:'7', 'pointer-events':'none'});
    svgEl.insertBefore(r, svgEl.firstChild);
  }
  r.setAttribute('x', pos.x0);
  r.setAttribute('y', pos.top - 26);
  r.setAttribute('width', pos.w);
  r.setAttribute('height', 4*LG + 52);
  lineDiv.scrollIntoView({block:'center', behavior:'smooth'});
}

function applyState(st){
  const songs = Array.isArray(st.songs) ? st.songs : [];
  const songName = st.currentSongIndex >= 0 ? songs[st.currentSongIndex] : null;
  const upcomingName = st.currentSongIndex >= 0 ? songs[st.currentSongIndex + 1] : null;

  lastSt = st;
  if(songName && songName !== videoSong) loadVideoMeta(songName);
  syncVideo(st);

  if(!songName){
    if(renderedSongs.length === 0) showEmpty('곡 재생을 기다리는 중…');
    return;
  }

  const cur = renderedSongs[0];
  if(!cur || cur.songName !== songName){
    const next = renderedSongs[1];
    if(next && next.songName === songName){
      // 이미 다음 곡으로 미리 그려둔 게 바로 지금 넘어간 곡이면, 다시 그리지 않고 그냥
      // "지금 재생 중"이 가리키는 자리만 옮긴다 — 화면은 계속 이어서 스크롤될 뿐 아무
      // 것도 다시 그려지지 않는다(전환처럼 안 보이는 이유).
      renderedSongs.shift();
      songDataReady = true;
      curMeasureHl = -1;
    } else {
      // 완전히 다른 곡으로 건너뜀(또는 첫 로드) — 이번만 처음부터 다시 그린다.
      if(loadingCurrent !== songName) startFreshWith(songName);
      return;   // 이 틱은 로딩을 기다림
    }
  }

  // 다음 곡 준비: 이미 맞는 곡이 붙어 있으면 그대로 두고, 아니면 새로 불러와 뒤에 이어붙인다.
  const haveNext = renderedSongs[1] && renderedSongs[1].songName === upcomingName;
  if(!haveNext){
    if(renderedSongs[1] && renderedSongs[1].songName !== upcomingName){
      // 다음 곡이 바뀌었다(세트리스트 재편 등) — 미리 그려둔 옛 다음 곡은 지운다.
      removeSongBlock(renderedSongs.pop());
      loadingNext = null;
    }
    if(upcomingName && loadingNext !== upcomingName){
      loadingNext = upcomingName;
      fetchChartData(upcomingName).then(data=>{
        if(loadingNext !== upcomingName) return;
        if(data) renderedSongs.push(appendSongBlock(upcomingName, data, false));
      });
    }
  }

  if(!songDataReady) return;   // 로딩 중(또는 채보 없음)이면 이 틱은 하이라이트 계산을 건너뜀
  const nowCur = renderedSongs[0];
  if(nowCur.startBarPos === null) return;
  if(!st.isPlaying || typeof st.barPosition !== 'number') return;
  const curMeasureIdx = Math.floor(st.barPosition - nowCur.startBarPos + 1e-6);   // 캡션과 동일한 부동소수점 보정
  if(curMeasureIdx === curMeasureHl) return;
  curMeasureHl = curMeasureIdx;
  setHighlight(curMeasureIdx);
}

// /chart에서 "서버에 저장"을 누르면 서버가 'drum-updated'를 쏜다(가사의 'lyrics-updated'와
// 같은 원리). 지금 화면에 떠 있는 곡이면 새로 받아와 다시 그린다 — 공연 중 급히 고친 게
// 새로고침 없이 바로 반영되게 하기 위함(2026-09-06 요청). 화면에 없는 곡이면 할 일 없음
// (그 곡 차례가 오면 어차피 fetchChartData가 새로 받아온다).
function refreshSongIfShown(songName){
  if(renderedSongs[0] && renderedSongs[0].songName === songName){
    // 지금 재생 중인 곡 — 화면 순서가 꼬이지 않게 안전하게 처음부터 다시 그린다
    // (appendSongBlock은 DOM 맨 뒤에 붙이는 방식이라, 자리 그대로 바꿔치기하면 이미
    // 붙어있는 "다음 곡" 미리보기보다 뒤로 밀려 순서가 뒤집힘 — 드문 이벤트라 이 정도
    // 다시 그리는 비용은 감수).
    startFreshWith(songName);
    return;
  }
  const nextIdx = renderedSongs.findIndex(s => s.songName === songName);
  if(nextIdx === -1) return;   // 화면에 없는 곡 — 다음에 그 곡 차례가 오면 새로 받아옴
  fetchChartData(songName).then(data=>{
    if(!data) return;
    removeSongBlock(renderedSongs[nextIdx]);
    renderedSongs[nextIdx] = appendSongBlock(songName, data, false);
  });
}

// ── 드럼 영상 ──────────────────────────────────────────────
// 영상 시간 = (로직 현재 위치 − 곡 시작 마커) + 시작점. 시작점은 곡마다 한 번 맞춰 서버에 저장.
// 시간 기준이라 곡 중간에 템포가 바뀌어도 어긋나지 않는다.
const vidWrapEl = document.getElementById('videoWrap');
const vid = document.getElementById('vid');
const offsetPanel = document.getElementById('offsetPanel');
let videoMeta = null;          // {song, offset, songStartMtc} — 영상이 있는 곡일 때만
let videoSong = null;          // 지금 메타를 조회한/조회 중인 곡
let viewMode = 'video';
try{ viewMode = localStorage.getItem('drumViewMode') || 'video'; }catch(e){}
let manualMode = false;
let lastSt = null;

function videoActive(){ return !!videoMeta && viewMode === 'video'; }
function applyViewMode(){
  const on = videoActive();
  vidWrapEl.style.display = on ? 'flex' : 'none';
  if(on){ scoreWrapEl.style.display = 'none'; noLinkEl.style.display = 'none'; }
  const t = document.getElementById('viewToggle');
  t.style.display = videoMeta ? '' : 'none';
  t.textContent = viewMode === 'video' ? '악보' : '영상';
  if(!on){ try{ vid.pause(); }catch(e){} offsetPanel.style.display = 'none'; }
}
document.getElementById('viewToggle').onclick = ()=>{
  viewMode = viewMode === 'video' ? 'score' : 'video';
  try{ localStorage.setItem('drumViewMode', viewMode); }catch(e){}
  applyViewMode();
  if(viewMode === 'score'){
    if(songDataReady) showScore();
    else { scoreWrapEl.style.display = 'none'; noLinkEl.style.display = 'flex'; }
  }
};

function loadVideoMeta(songName){
  videoSong = songName;
  fetch('/api/videoMeta?song='+encodeURIComponent(songName)).then(r=>r.json()).then(m=>{
    if(videoSong !== songName) return;
    if(m && m.linked && m.exists){
      const changed = !videoMeta || videoMeta.song !== songName;
      const keepLocal = videoMeta && videoMeta.song === songName && (savingOffset || pendingOffset);   // 저장 중인 값을 서버의 옛 값으로 되돌리지 않는다
      videoMeta = {song: songName, offset: keepLocal ? videoMeta.offset : (+m.offset || 0), songStartMtc: (typeof m.songStartMtc === 'number') ? m.songStartMtc : null};
      document.getElementById('offsetVal').textContent = videoMeta.offset.toFixed(2);
      if(changed){ vid.src = '/api/video?song='+encodeURIComponent(songName); vid.load(); }
    } else {
      videoMeta = null;
      try{ vid.pause(); vid.removeAttribute('src'); vid.load(); }catch(e){}
    }
    applyViewMode();
    if(lastSt) syncVideo(lastSt);
  }).catch(()=>{});
}

function songElapsed(st){
  if(!videoMeta || videoMeta.songStartMtc === null || typeof st.mtcSeconds !== 'number') return null;
  return st.mtcSeconds - videoMeta.songStartMtc;
}
// 되감기(seek)는 비싸다 — 긴 키프레임 간격(예: 8초, 5K 해상도)이면 한 번에 0.5초 안팎이 걸린다. 오차가
// 조금만 나도 되감으면 되감는 동안 로직은 계속 흘러서 끝나자마자 또 뒤처져 다시 되감는 악순환이
// 되고 영상이 끊긴다(2026-11-22, 55번/15초 되감기로 확인). 그래서:
//  · 작은 오차는 되감지 않고 재생 속도를 살짝 올리거나 내려서 따라잡고,
//  · 큰 오차일 때만 되감되 그 사이 흐를 시간(직전 되감기에 실제로 걸린 시간)만큼 앞질러 가고,
//  · 되감은 직후엔 잠시 다시 되감지 않는다.
let seekStartedAt = 0, seekLatency = 0.5, lastSeekDoneAt = 0;
vid.addEventListener('seeked', ()=>{
  seekLatency = Math.min(2.5, Math.max(0.1, (performance.now() - seekStartedAt)/1000));
  lastSeekDoneAt = performance.now();
});
function seekTo(t, lead){
  if(vid.seeking) return;
  seekStartedAt = performance.now();
  try{ vid.currentTime = Math.max(0, t + (lead||0)); }catch(e){}
}
function setRate(r){ if(vid.playbackRate !== r) vid.playbackRate = r; }
const HARD_SEEK_SEC = 1.0;     // 이보다 크게 어긋났을 때만 되감는다
const SOFT_SYNC_SEC = 0.12;    // 이보다 작으면 그대로 둔다(그 사이는 속도 조절)

function syncVideo(st){
  if(!videoActive() || manualMode) return;
  const el = songElapsed(st);
  if(el === null) return;
  const target = el + videoMeta.offset;
  const dur = vid.duration;
  if(target < 0){                       // 곡 시작 전 — 영상 첫 프레임에서 대기
    if(!vid.paused) vid.pause();
    setRate(1);
    if(vid.currentTime > 0.05) seekTo(0);
    return;
  }
  if(isFinite(dur) && target >= dur - 0.05){   // 영상보다 곡이 길면 마지막 프레임에서 멈춤
    if(!vid.paused) vid.pause();
    setRate(1);
    seekTo(Math.max(0, dur - 0.05));
    return;
  }
  const diff = vid.currentTime - target;        // +면 영상이 앞섬, −면 뒤처짐
  if(st.isPlaying){
    if(vid.paused){
      // 정지 중에 이미 그 자리에 세워 둬서 보통은 되감을 필요 없이 그냥 재생하면 된다
      if(Math.abs(diff) > 0.3) seekTo(target, seekLatency);
      setRate(1);
      vid.play().catch(()=>{});
    } else if(vid.seeking){
      return;
    } else if(Math.abs(diff) > HARD_SEEK_SEC && performance.now() - lastSeekDoneAt > 1500){
      seekTo(target, seekLatency);
    } else if(Math.abs(diff) > SOFT_SYNC_SEC){
      setRate(diff < 0 ? 1.08 : 0.92);
    } else {
      setRate(1);
    }
  } else {
    if(!vid.paused) vid.pause();
    setRate(1);
    if(Math.abs(diff) > 0.1) seekTo(target);
  }
}

// ⚙ 시작점 패널
const offsetMsg = document.getElementById('offsetMsg');
function saveOffset(v){
  if(!videoMeta) return;
  if(isFinite(vid.duration) && v > vid.duration){ offsetMsg.textContent = '시작점이 영상 길이를 넘어요.'; return false; }
  offsetMsg.textContent = '';
  videoMeta.offset = v;
  document.getElementById('offsetVal').textContent = v.toFixed(2);
  pendingOffset = {song: videoMeta.song, offset: v};
  flushOffset();
  if(lastSt) syncVideo(lastSt);
  return true;
}
// 빠르게 여러 번 눌러도 저장 요청이 순서가 뒤바뀌어 도착하지 않도록 한 번에 하나씩, 최신 값만 보낸다.
let savingOffset = false, pendingOffset = null;
function flushOffset(){
  if(savingOffset || !pendingOffset) return;
  savingOffset = true;
  const body = JSON.stringify(pendingOffset); pendingOffset = null;
  fetch('/save-video-offset',{method:'POST',headers:{'Content-Type':'application/json'},body})
    .catch(()=>{ offsetMsg.textContent = '저장 실패'; })
    .finally(()=>{ savingOffset = false; flushOffset(); });
}
document.getElementById('offsetBtn').onclick = ()=>{
  offsetPanel.style.display = offsetPanel.style.display === 'block' ? 'none' : 'block';
};
offsetPanel.querySelectorAll('button[data-n]').forEach(b=>{
  b.onclick = ()=>{ if(videoMeta) saveOffset(Math.round((videoMeta.offset + parseFloat(b.dataset.n))*100)/100); };
});
document.getElementById('followChk').onchange = e=>{
  manualMode = !e.target.checked;
  document.getElementById('manualRow').style.display = manualMode ? 'flex' : 'none';
  document.getElementById('setRow').style.display = manualMode ? 'flex' : 'none';
  if(manualMode){
    vid.pause();
    const sc = document.getElementById('scrub');
    sc.max = isFinite(vid.duration) ? vid.duration : 1; sc.value = vid.currentTime;
  } else if(lastSt) syncVideo(lastSt);
};
document.getElementById('scrub').oninput = e=>{ seekTo(parseFloat(e.target.value)); };
offsetPanel.querySelectorAll('button[data-s]').forEach(b=>{
  b.onclick = ()=>{
    seekTo(vid.currentTime + parseFloat(b.dataset.s));
    document.getElementById('scrub').value = vid.currentTime + parseFloat(b.dataset.s);
  };
});
document.getElementById('setHere').onclick = ()=>{
  const el = lastSt ? songElapsed(lastSt) : null;
  if(el === null){ offsetMsg.textContent = '로직 위치/곡 시작을 아직 몰라요. 로직에서 곡을 위치시켜 주세요.'; return; }
  const v = Math.round((vid.currentTime - el)*100)/100;
  if(saveOffset(v)){
    document.getElementById('followChk').checked = true;
    document.getElementById('followChk').onchange({target:{checked:true}});
  }
};

showEmpty('곡 재생을 기다리는 중…');
// index.html/singer.html과 동일한 재연결 패턴 — 브라우저 기본 EventSource 자동 재연결만
// 믿었더니, 화면을 오래 켜둬서(백그라운드 탭·절전 등) 연결이 조용히 끊긴 뒤 다시 안 살아나
// 악보가 멈춘 채로 안 보이는 문제가 있었음(2026-08-30). 직접 닫고 지수 백오프로 재연결한다.
(function connectSSE(){
  let es, reconnectDelay = 1000;
  // 조용함 감시 — onerror만으로는 "겉보기엔 열려있지만 실제론 죽은" 연결을 못 잡는 경우가
  // 있어(2026-09-08, /band·/singer 리포트로 확인) 같이 추가. 재생 중엔 신호가 계속 와서
  // 절대 안 끼어들고, 로직 정지로 조용한 구간에서만 스스로 재연결한다.
  const SILENCE_MS = 90000;
  let lastMsgAt = Date.now();
  let silenceTimer = null;
  function armSilenceWatch(){
    clearInterval(silenceTimer);
    silenceTimer = setInterval(() => {
      if(Date.now() - lastMsgAt > SILENCE_MS) { es.close(); connect(); }
    }, 10000);
  }
  function connect(){
    try{ es = new EventSource('/events'); }catch(e){ return; }
    lastMsgAt = Date.now();
    es.onopen = ()=>{ reconnectDelay = 1000; lastMsgAt = Date.now(); };
    es.onmessage = e=>{
      lastMsgAt = Date.now();
      let st; try{ st = JSON.parse(e.data); }catch(err){ return; }
      applyState(st);
    };
    es.addEventListener('drum-updated', e=>{
      lastMsgAt = Date.now();
      let d; try{ d = JSON.parse(e.data); }catch(err){ return; }
      if(d && typeof d.song === 'string') refreshSongIfShown(d.song);
    });
    es.addEventListener('video-updated', e=>{
      lastMsgAt = Date.now();
      let d; try{ d = JSON.parse(e.data); }catch(err){ return; }
      if(d && d.song === videoSong) loadVideoMeta(d.song);
    });
    es.onerror = ()=>{
      es.close();
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    };
    armSilenceWatch();
  }
  connect();
})();
</script>
